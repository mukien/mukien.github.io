<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>MIDI镜像翻转</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <!-- 顶栏 -->
  <div class="header">
    <h1><span class="material-symbols-outlined">sync</span>MIDI 镜像</h1>
    <span class="header-badge">一音一翻</span>
  </div>

  <!-- 视频 -->
  <div class="video-box">
    <div class="video-inner" id="vInner">
      <video id="v" src="" muted loop playsinline crossorigin="anonymous" preload="auto"></video>
    </div>
    <div class="video-placeholder" id="ph">
      <span class="material-symbols-outlined">play_circle</span>
      <span>加载视频</span>
    </div>
  </div>
  <div class="video-name" id="vInfo">未选择视频</div>

  <!-- 播放控制 -->
  <div class="controls">
    <button class="btn btn-play" id="playBtn" disabled><span class="material-symbols-outlined">play_arrow</span></button>
    <button class="btn btn-pause" id="pauseBtn" disabled><span class="material-symbols-outlined">pause</span></button>
    <button class="btn btn-stop" id="stopBtn" disabled><span class="material-symbols-outlined">stop</span></button>
    <button class="btn btn-record" id="recBtn" disabled><span class="material-symbols-outlined">fiber_manual_record</span></button>
    <button class="btn btn-save" id="saveBtn" disabled><span class="material-symbols-outlined">save</span></button>
  </div>

  <!-- 参数卡片 -->
  <div class="param-card">
    <div class="param-row">
      <span class="param-label"><span class="material-symbols-outlined">settings</span>画质</span>
      <select class="md-select" id="res"><option value="480">SD</option><option value="720" selected>HD</option><option value="1080">FHD</option><option value="1440">2K</option></select>

      <span class="param-label"><span class="material-symbols-outlined">speed</span>帧率</span>
      <select class="md-select" id="fps"><option value="24">24</option><option value="30" selected>30</option><option value="60">60</option></select>

      <span class="param-label"><span class="material-symbols-outlined">data_usage</span>码率</span>
      <input type="range" class="md-slider" id="bitrate" min="3" max="40" value="10" step="1">
      <span class="badge" id="bitrateVal">10M</span>
    </div>
    <div class="param-row" style="margin-top:6px;">
      <span class="param-label"><span class="material-symbols-outlined">queue_music</span>音轨</span>
      <select class="md-select" id="track"><option value="all">全部</option></select>

      <span class="param-label"><span class="material-symbols-outlined">piano</span>音色</span>
      <select class="md-select" id="inst">
        <option value="piano">钢琴</option><option value="violin">提琴</option>
        <option value="flute">长笛</option><option value="trumpet">小号</option>
        <option value="guitar">吉他</option><option value="bass">贝斯</option>
      </select>

      <span class="param-label"><span class="material-symbols-outlined">volume_up</span>音量</span>
      <input type="range" class="md-slider" id="vol" min="0" max="100" value="60" step="1">
      <span class="badge" id="volVal">60%</span>
      <span class="badge badge-highlight" id="bpm">120</span>
    </div>
  </div>

  <!-- 文件选择 -->
  <div class="file-row">
    <input type="file" id="vInput" accept="video/*">
    <button class="btn btn-outline" id="vBtn"><span class="material-symbols-outlined">video_file</span> 视频</button>
    <input type="file" id="mInput" accept=".mid,.midi">
    <button class="btn btn-outline" id="mBtn"><span class="material-symbols-outlined">music_note</span> MIDI</button>
  </div>

  <!-- 进度 -->
  <div class="progress"><div class="progress-fill" id="barFill"></div></div>

  <!-- 转MP4 -->
  <div class="convert-row">
    <span style="font-size:0.6rem;color:#7a7880;">转MP4</span>
    <button class="btn btn-outline btn-sm" id="c1" disabled>CloudConvert</button>
    <button class="btn btn-outline btn-sm" id="c2" disabled>Convertio</button>
  </div>

  <!-- 状态 -->
  <div class="status-bar">
    <span class="status-item"><span class="led" id="led"></span><span id="status">就绪</span></span>
    <span class="status-item"><span class="material-symbols-outlined" style="font-size:0.8rem;">note</span><span class="status-badge" id="note">—</span></span>
    <span class="status-item"><span class="material-symbols-outlined" style="font-size:0.8rem;">flip</span><span id="mirror">正常</span></span>
  </div>

  <div class="footer">每个音符触发翻转 · 视频从第一个音符开始</div>
</div>

<script src="script.js"></script>
</body>
</html>
