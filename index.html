<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>MIDI镜像翻转 · Material You</title>
  <!-- 引入 Material Symbols & Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
  <!-- 引入独立 CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- ===== 顶部栏 ===== -->
  <div class="top-bar">
    <h1>
      <span class="material-symbols-outlined">music_note</span>
      MIDI 镜像
    </h1>
    <div class="chip-group">
      <span class="chip"><span class="material-symbols-outlined">sync</span> 一音一翻</span>
      <span class="chip active"><span class="material-symbols-outlined">play_circle</span> 首音同步</span>
    </div>
  </div>

  <!-- ===== 控制卡片 1：画质 / 帧率 / 码率 ===== -->
  <div class="card">
    <div class="control-row">
      <span class="label"><span class="material-symbols-outlined">settings</span> 画质</span>
      <select class="md-select" id="res">
        <option value="480">SD</option>
        <option value="720" selected>HD</option>
        <option value="1080">FHD</option>
        <option value="1440">2K</option>
      </select>

      <span class="label"><span class="material-symbols-outlined">speed</span> 帧率</span>
      <select class="md-select" id="fps">
        <option value="24">24</option>
        <option value="30" selected>30</option>
        <option value="60">60</option>
      </select>

      <span class="label"><span class="material-symbols-outlined">data_usage</span> 码率</span>
      <input type="range" class="md-slider" id="bitrate" min="3" max="40" value="10" step="1">
      <span class="badge" id="bitrateVal">10M</span>
    </div>
  </div>

  <!-- ===== 控制卡片 2：音轨 / 音色 / 音量 ===== -->
  <div class="card">
    <div class="control-row">
      <span class="label"><span class="material-symbols-outlined">queue_music</span> 音轨</span>
      <select class="md-select" id="track"><option value="all">全部</option></select>

      <span class="label"><span class="material-symbols-outlined">piano</span> 音色</span>
      <select class="md-select" id="inst">
        <option value="piano">钢琴</option><option value="violin">提琴</option>
        <option value="flute">长笛</option><option value="trumpet">小号</option>
        <option value="guitar">吉他</option><option value="bass">贝斯</option>
      </select>

      <span class="label"><span class="material-symbols-outlined">volume_up</span> 音量</span>
      <input type="range" class="md-slider" id="vol" min="0" max="100" value="60" step="1">
      <span class="badge" id="volVal">60%</span>
      <span class="badge highlight" id="bpm">120</span>
    </div>
  </div>

  <!-- ===== 视频区 ===== -->
  <div class="video-box">
    <div class="video-inner" id="vInner">
      <video id="v" src="" muted loop playsinline crossorigin="anonymous" preload="auto"></video>
    </div>
    <div class="placeholder" id="ph">
      <span class="material-symbols-outlined">videocam_off</span>
      <span>请选择视频</span>
    </div>
  </div>
  <div class="video-info" id="vInfo">未选择视频</div>

  <!-- ===== 播放控制按钮组 ===== -->
  <div class="btn-group" style="margin-bottom:8px;">
    <button class="btn success" id="playBtn" disabled>
      <span class="material-symbols-outlined">play_arrow</span> 播放
    </button>
    <button class="btn warning" id="pauseBtn" disabled>
      <span class="material-symbols-outlined">pause</span> 暂停
    </button>
    <button class="btn danger" id="stopBtn" disabled>
      <span class="material-symbols-outlined">stop</span> 停止
    </button>
    <button class="btn danger" id="recBtn" disabled>
      <span class="material-symbols-outlined">fiber_manual_record</span> 录制
    </button>
    <button class="btn primary" id="saveBtn" disabled>
      <span class="material-symbols-outlined">save</span> 保存
    </button>
  </div>

  <!-- ===== 转MP4辅助 ===== -->
  <div class="btn-group" style="margin-bottom:6px;">
    <span class="label" style="font-size:0.7rem;color:#9a98a0;">转MP4:</span>
    <button class="btn small tertiary" id="c1" disabled>CloudConvert</button>
    <button class="btn small tertiary" id="c2" disabled>Convertio</button>
  </div>

  <!-- ===== 进度条 ===== -->
  <div class="progress-bar">
    <div class="progress-fill" id="barFill"></div>
  </div>

  <!-- ===== 文件选择按钮 ===== -->
  <div class="file-row">
    <input type="file" id="vInput" accept="video/*">
    <button class="btn tertiary" id="vBtn">
      <span class="material-symbols-outlined">video_file</span> 视频
    </button>
    <input type="file" id="mInput" accept=".mid,.midi">
    <button class="btn tertiary" id="mBtn">
      <span class="material-symbols-outlined">music_score</span> MIDI
    </button>
  </div>

  <!-- ===== 状态栏 ===== -->
  <div class="status-row">
    <span class="status-item">
      <span class="led" id="led"></span>
      <span id="status">就绪</span>
    </span>
    <span class="status-item">
      <span class="material-symbols-outlined" style="font-size:0.9rem;">note</span>
      <span class="badge" id="note">—</span>
    </span>
    <span class="status-item">
      <span class="material-symbols-outlined" style="font-size:0.9rem;">flip</span>
      <span id="mirror" style="color:#9a98a0;">正常</span>
    </span>
  </div>

  <div class="footer">每个音符触发一次翻转 · 视频从第一个音符开始</div>
</div>

<!-- 引入独立 JavaScript -->
<script src="script.js"></script>
</body>
</html>
