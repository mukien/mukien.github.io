<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>MIDI镜像翻转 · 一音一翻</title>
  <!-- 外部CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 标题 -->
    <div class="title">🎹 MIDI镜像翻转 <span>一音一翻</span></div>
    
    <!-- 画质/帧率/码率 -->
    <div class="row center">
      <span class="label">画质</span>
      <select id="res">
        <option value="480">SD</option>
        <option value="720" selected>HD</option>
        <option value="1080">FHD</option>
        <option value="1440">2K</option>
      </select>
      
      <span class="label">帧率</span>
      <select id="fps">
        <option value="24">24</option>
        <option value="30" selected>30</option>
        <option value="60">60</option>
      </select>
      
      <span class="label">码率</span>
      <input type="range" id="bitrate" min="3" max="40" value="10" step="1">
      <span class="badge" id="bitrateVal">10M</span>
    </div>

    <!-- 音轨/音色/音量/BPM -->
    <div class="row center">
      <span class="label">音轨</span>
      <select id="track">
        <option value="all">全部</option>
      </select>
      
      <span class="label">音色</span>
      <select id="inst">
        <option value="piano">钢琴</option>
        <option value="violin">提琴</option>
        <option value="flute">长笛</option>
        <option value="trumpet">小号</option>
        <option value="guitar">吉他</option>
        <option value="bass">贝斯</option>
      </select>
      
      <span class="label">音量</span>
      <input type="range" id="vol" min="0" max="100" value="60" step="1">
      <span class="badge" id="volVal">60%</span>
      <span class="badge" id="bpm">120</span>
    </div>

    <!-- 视频容器 -->
    <div class="video-box">
      <div class="video-inner" id="vInner">
        <video id="v" src="" muted loop playsinline crossorigin="anonymous" preload="auto"></video>
      </div>
      <div class="placeholder" id="ph">📁 请选择视频</div>
    </div>
    <div class="info" style="text-align:center;margin-bottom:0.3rem;" id="vInfo">未选择视频</div>

    <!-- 控制按钮 -->
    <div class="row center">
      <button class="btn play" id="playBtn" disabled>▶</button>
      <button class="btn pause" id="pauseBtn" disabled>⏸</button>
      <button class="btn stop" id="stopBtn" disabled>⏹</button>
      <button class="btn rec" id="recBtn" disabled>🔴</button>
      <button class="btn save" id="saveBtn" disabled>💾</button>
    </div>

    <!-- 转换按钮 -->
    <div class="row center">
      <span class="info">转MP4:</span>
      <button class="btn small" id="c1" disabled>CloudConvert</button>
      <button class="btn small" id="c2" disabled>Convertio</button>
    </div>

    <!-- 进度条 -->
    <div class="bar">
      <div class="bar-fill" id="barFill"></div>
    </div>

    <!-- 文件选择 -->
    <div class="row center">
      <input type="file" id="vInput" accept="video/*">
      <button class="btn" id="vBtn">🎥 视频</button>
      
      <input type="file" id="mInput" accept=".mid,.midi">
      <button class="btn" id="mBtn">🎵 MIDI</button>
    </div>

    <!-- 状态栏 -->
    <div class="row center" style="font-size:0.7rem;">
      <span class="led" id="led"></span>
      <span id="status">就绪</span>
      <span class="badge" id="note">—</span>
      <span id="mirror" class="info">正常</span>
    </div>
    <div class="footer">每个音符触发一次镜像翻转</div>
  </div>

  <!-- 外部JS -->
  <script src="script.js"></script>
</body>
</html>
